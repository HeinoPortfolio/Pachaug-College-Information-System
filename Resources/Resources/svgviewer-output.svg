<svg xmlns="http://w3.org" viewBox="0 0 200 200" width="200" height="200">
  <!-- Deep Ocean App Icon Background -->
  <rect width="200" height="200" rx="44" fill="#0B192C" />

  <!-- Fish 1 (Crisp White): Sweeps up from the bottom P-stem and curls clockwise into the upper bowl -->
  <path d="M 60 164
           C 54 134, 54 96, 62 68
           C 70 42, 96 34, 120 40
           C 146 46, 158 72, 148 96
           C 140 114, 118 120, 104 108
           C 92 98, 96 78, 110 76
           C 120 74, 126 82, 122 90
           C 132 86, 134 70, 122 62
           C 106 52, 84 62, 80 86
           C 76 112, 82 140, 88 164
           L 74 152
           Z"
        fill="#F8FAFC" />

  <!-- Fish 2 (Bioluminescent Cyan): Interlocks underneath the bowl and tapers down into a flowing tail -->
  <path d="M 148 96
           C 140 122, 114 132, 88 124
           C 76 120, 68 112, 66 100
           C 74 108, 86 112, 98 110
           C 116 107, 128 92, 124 76
           C 122 68, 114 62, 106 64
           C 118 58, 134 64, 138 78
           C 142 94, 130 112, 112 116
           C 96 120, 82 112, 78 98
           C 76 118, 92 136, 114 136
           C 134 136, 150 120, 152 100
           Z"
        fill="#06B6D4" />

  <!-- Inner Yin-Yang Core Counter-Swirl (Reinforces the S-curve inside the P bowl) -->
  <path d="M 108 58
           A 24 24 0 0 1 108 106
           A 12 12 0 0 1 108 82
           A 12 12 0 0 0 108 58
           Z"
        fill="#06B6D4" />

  <!-- Coral Focus Eye on the White Fish Head -->
  <circle cx="126" cy="54" r="5" fill="#FB7185" />

  <!-- Deep Navy Eye on the Cyan Swirl -->
  <circle cx="108" cy="94" r="4.5" fill="#0B192C" />
</svg>
